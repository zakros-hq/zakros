# Iris conversational pod — long-running, single replica.
# Applied by deploy/iris-install.sh against the labyrinth k3s cluster.
# Phase 2 Slice H2a: Iris routes every Anthropic call through Apollo
# (no direct Anthropic credential in this pod). Phase 3 flips backend
# to Athena Ollama.
apiVersion: v1
kind: Namespace
metadata:
  name: zakros
---
apiVersion: v1
kind: Secret
metadata:
  name: iris-secrets
  namespace: zakros
type: Opaque
stringData:
  # All three are populated by deploy/iris-install.sh from secrets.json.
  # Slice H2a: anthropic-api-key is gone from this pod — Apollo holds it.
  iris-bearer:        REPLACE_IRIS_BEARER
  iris-admin-token:   REPLACE_IRIS_ADMIN_TOKEN
  database-url:       REPLACE_DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris
  namespace: zakros
  labels:
    zakros.project/pod-class: iris
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      zakros.project/pod-class: iris
  template:
    metadata:
      labels:
        zakros.project/pod-class: iris
    spec:
      restartPolicy: Always
      containers:
        - name: iris
          image: zakros/iris:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ZAKROS_MINOS_URL
              value: REPLACE_MINOS_URL
            - name: ZAKROS_APOLLO_URL
              value: REPLACE_APOLLO_URL
            - name: IRIS_PROJECT_ID
              value: REPLACE_PROJECT_ID
            - name: IRIS_DEFAULT_REPO_URL
              value: REPLACE_DEFAULT_REPO_URL
            - name: IRIS_DEFAULT_BRANCH_PREFIX
              value: "iris/"
            - name: IRIS_MODEL
              value: "claude-sonnet-4-5"
            - name: IRIS_BEARER
              valueFrom:
                secretKeyRef:
                  name: iris-secrets
                  key: iris-bearer
            - name: IRIS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iris-secrets
                  key: iris-admin-token
            - name: IRIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iris-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
